# Codex CLI Configuration
# Location: ~/.codex/config.toml or project-specific .codex/config.toml
#
# This configuration uses the current Codex config schema. The repo-native
# dangerous-command protection lives in the shared hook script below; use that
# script to change blocked patterns instead of adding obsolete approval-policy
# rule tables here.

# Let the model decide when to ask for approval. Codex removed the "untrusted"
# value; as of codex-cli 0.128.0 the supported values are "on-request" and
# "never", and an unsupported value is a *fatal* config error -- Codex refuses
# to start at all, taking the hook with it (#681).
approval_policy = "on-request"

[features]
# Enable lifecycle hook support for the shared dangerous-command policy.
# `codex_hooks` was the old name and is deprecated; Codex warns on it today
# and a removed flag would silently disable the hook (#681).
hooks = true

# =============================================================================
# PRE-TOOL-USE HOOK — Primary defense
# =============================================================================
# The shared hook script provides context-aware blocking via tokenization,
# protected-branch detection, and chained-command scanning.
[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/tools/hooks/ai/block-dangerous-commands.py"'
timeout = 30
statusMessage = "Checking Bash command"

# =============================================================================
# FILE-EDIT HOOK — Blocks env-var persistence attempts
# =============================================================================
# Codex's file-edit tool is `apply_patch`, not Claude's Edit/Write/MultiEdit
# triple -- verified by probe, see docs/development/ai/command-blocking.md.
# Its payload is command-shaped, so the hook checks it both as a command and as
# a set of file edits.
[[hooks.PreToolUse]]
matcher = "^apply_patch$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/tools/hooks/ai/block-dangerous-commands.py"'
timeout = 30
statusMessage = "Checking file edit"

# =============================================================================
# SHELL ENVIRONMENT POLICY
# =============================================================================
[shell_environment_policy]
inherit = "core"
include_only = [
    "PATH",
    "HOME",
    "USER",
    "UV_CACHE_DIR",
    "VIRTUAL_ENV",
    "PYTHONPATH",
]
exclude = [
    "*_API_KEY",
    "*_SECRET",
    "*_TOKEN",
    "PASSWORD",
    "PYPI_TOKEN",
    "CODECOV_TOKEN",
]

# Sandbox mode is intentionally left to the user's Codex environment defaults.
# If your local setup needs a project override, add it explicitly using the
# current Codex config keys from the official docs.
