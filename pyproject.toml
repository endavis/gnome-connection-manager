[project]
name = "gnome-connection-manager"
version = "1.2.2"
description = "A tabbed SSH and telnet connection manager for GTK environments"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Renzo Bertuzzi", email = "kuthulu@gmail.com"},
]
maintainers = [
    {name = "Eric Davis", email = "6662995+endavis@users.noreply.github.com"},
]
keywords = ["ssh", "terminal", "gtk", "connection-manager", "vte"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: Terminals",
]

dependencies = [
    # Note: pygobject and pycairo should be installed via system packages:
    #   Ubuntu/Debian: sudo apt install python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-vte-2.91
    #   Fedora: sudo dnf install python3-gobject gtk3 vte291
    # They are not listed here to avoid build issues
    "pyaes>=1.6.1",
]

[project.optional-dependencies]
# Mirrors pyproject-template's dev extra so a sync does not fight this list. rich is the
# one addition: the template carries it as a runtime dependency, but GCM only needs it
# because tools/doit imports it, so here it is a dev tool.
dev = [
    "doit>=0.36.0",
    "rich>=13.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ruff>=0.16.3",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "pymdown-extensions>=11.0.1",
    "codespell>=2.4.3",
    "pyproject-fmt>=2.28.0",
    "commitizen>=4.17.1",
    "pyright>=1.1.411",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0.12.20260815",
    "vulture>=2.11",
    "radon>=6.0",
    "pytest-benchmark>=4.0",
    "mutmut>=3.7.0",
    "hypothesis>=6.165.10",
]
security = [
    "pip-audit>=2.10.1",
    "bandit>=1.7",
    "pip>=26.2.1",
    "pip-licenses>=4.0",
    "cyclonedx-bom>=7.3.1",
]

[project.urls]
Homepage = "https://github.com/endavis/gnome-connection-manager"
Repository = "https://github.com/endavis/gnome-connection-manager.git"
Issues = "https://github.com/endavis/gnome-connection-manager/issues"

[project.scripts]
gnome-connection-manager = "gnome_connection_manager.__main__:main"
gcm = "gnome_connection_manager.__main__:main"

[project.gui-scripts]
gnome-connection-manager-gui = "gnome_connection_manager.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gnome_connection_manager"]
only-include = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/data",
    "/lang",
    "/scripts",
]

# Ruff - Modern Python linter and formatter
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "N802",   # function name should be lowercase (GTK uses camelCase)
    "N803",   # argument name should be lowercase (GTK uses camelCase)
    "N806",   # variable in function should be lowercase (GTK uses camelCase)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
# Vendored from pyproject-template and replaced wholesale on every sync, so fixing
# findings here would be undone by the next one. Upstream lints them under its own
# config, which does not select PTH (flake8-use-pathlib) -- hence the 40-odd os.path
# calls. Our own tools/doit/gcm.py sits in this tree but passes these rules anyway.
"tools/doit/*" = ["E741", "F401", "PTH"]
"tools/pyproject_template/*" = ["E741", "F401", "PTH"]
# Tests vendored from the template alongside the hooks and workflows they cover (#127).
# Same reasoning as the tools/ entries above: they are replaced wholesale on a sync, and
# upstream lints them under a config that does not select TC (flake8-type-checking).
"tests/test_hook_*.py" = ["TC"]
"tests/test_bash_ban_raw_tools.py" = ["TC"]
"tests/test_ci_workflow.py" = ["TC"]
"tests/test_codeql_workflow.py" = ["TC"]
"tests/test_workflow_action_pinning.py" = ["TC"]
"tests/test_dependabot_*.py" = ["TC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# Mypy - Static type checker
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, gradually enable
ignore_missing_imports = true  # GTK bindings don't have type stubs
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# app.py is the pre-split monolith: one 4,600-line module of GTK widgets wired up
# dynamically, where attributes are attached to Vte.Terminal at runtime and glade
# supplies half the callers. mypy cannot follow any of that, and the codes below are
# where essentially all of it lands -- 118 of the 132 errors it reports here.
#
# Relaxed rather than excluded, deliberately: the remaining codes still apply, and every
# other module in the package stays fully checked. Narrow this as app.py is broken up.
module = "gnome_connection_manager.app"
disable_error_code = [
    "attr-defined",
    "arg-type",
    "has-type",
    "name-defined",
    "union-attr",
]

[[tool.mypy.overrides]]
# The suite works by handing the code fakes that carry only the surface under test, so
# attributes appear on stub objects and methods are reassigned on purpose. Those codes
# are the testing style, not defects. Everything else still applies to tests.
module = "tests.*"
disable_error_code = [
    "attr-defined",
    "method-assign",
    "union-attr",
    # A fake is deliberately assigned where the real type is declared, and stubs are
    # built up field by field, so these follow from the same style as the three above.
    "assignment",
    "index",
    "arg-type",
    "call-arg",
    "func-returns-value",
    "unused-ignore",
]

# Bandit - security linter
[tool.bandit]
exclude_dirs = [
    "tests",
    "tmp",
    ".venv",
    "docs",
    ".git",
    ".github",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]
# B603/B607 are what GCM is for: it spawns ssh, telnet and the user's shell, by design
# and with an argv list rather than a shell string. B101 is asserts in our own tooling.
# Matches the template's skips.
skips = [
    "B101",  # asserts in our own tooling
    "B603",  # subprocess without shell=True -- that is the safe form, and GCM's purpose
    "B607",  # partial executable path -- ssh/telnet/$SHELL are resolved from PATH by design
    "B404",  # importing subprocess at all, which follows from the two above
    "B105",  # "hardcoded password" -- empty `pwd=""` defaults and variables named `pass*`
    "B107",  # same, as a default argument
    "B606",  # os.startfile on the unreachable nt branch of the donate handler
    "B310",  # urlopen for the update check, against a constant https URL
    "B110",  # try/except/pass around optional GTK calls that differ across VTE versions
]

# Vulture - dead code detection
[tool.vulture]
min_confidence = 80
paths = ["src", "tools"]
exclude = [
    "*/__pycache__/*",
]
ignore_names = [
    # GTK calls these back by name from the glade file, so nothing in Python
    # references them and vulture cannot see the caller.
    "on_*",
    "do_*",
    "test_*",
    "fixture_*",
    # Imported under `if TYPE_CHECKING:` in vendored template code and referenced only
    # from string annotations, which vulture does not parse. Matches upstream.
    "ConsoleType",
]

# Codespell - spelling
[tool.codespell]
skip = "tmp,.venv,.git,*.lock,*.pyc,__pycache__,lang,*.mo,*.po,data"
# The UI strings are Spanish, and so are the fixtures that assert on them. Each of these
# is a correctly spelled Spanish word that happens to look like an English typo.
ignore-words-list = "comando,comandos,controles,direccion,historial,requiere,ser,sesion,varios,nd,pres"

# Pytest - Testing framework
[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so tests can import tools.doit.* -- the doit tasks are
# project code and are tested like any other. Matches the template's own setting.
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=gnome_connection_manager",
]

# Coverage
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
