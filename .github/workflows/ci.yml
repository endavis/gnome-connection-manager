name: CI

# Adapted from pyproject-template. The template runs a matrix of Python versions across
# ubuntu, windows and macos; GCM can do none of that.
#
# GCM imports GTK 3 and VTE through PyGObject, which is an apt package built for the
# distribution's own interpreter and living in /usr/lib/python3/dist-packages. It is not
# installable from PyPI. So:
#
#   * Linux only -- there is no GTK 3 / VTE stack to test against on windows or macos.
#   * No actions/setup-python -- that installs a separate interpreter which cannot see
#     apt's dist-packages, so `import gi` would fail no matter what else was configured.
#     The venv is built from /usr/bin/python3 with --system-site-packages instead.
#   * ubuntu-24.04 pinned rather than ubuntu-latest, so the system interpreter stays the
#     3.12 that .python-version names and that apt's PyGObject is built for.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  # gettext for msgfmt, which the catalog tests compare their fallback against;
  # xvfb for the tests that drive real Gtk/Vte windows (#113).
  #
  # expect is not optional here. app.py checks for it at *import* time and, if it is
  # missing, opens a modal Gtk.MessageDialog and calls run() on it -- which blocks
  # forever with nobody to click OK. Every test that imports the real module then sits
  # there until its own 90s subprocess timeout, several times over. See #118.
  #
  # gtk-vnc's bindings, TigerVNC's server and tools, and xsetroot are for
  # tests/test_vnc.py, which connects to a real VNC server and skips without them (#234).
  #
  # libxtst6 is for tests/test_console_window.py, which presses keys and drags tabs with
  # real X input through XTest, reached by ctypes, and fails without it (#255).
  #
  # sshfs and openssh-server are for tests/test_host_files.py, which mounts a host with
  # sshfs through a real ssh and an sshd of its own, and skips without them (#267).
  SYSTEM_PACKAGES: >-
    python3-gi
    python3-gi-cairo
    gir1.2-gtk-3.0
    gir1.2-vte-2.91
    xvfb
    gettext
    expect
    gir1.2-gtk-vnc-2.0
    tigervnc-standalone-server
    tigervnc-tools
    x11-xserver-utils
    libxtst6
    sshfs
    openssh-server

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the GTK stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $SYSTEM_PACKAGES

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Create the environment
        run: |
          uv venv --system-site-packages --python /usr/bin/python3
          uv sync --all-extras --dev

      - name: Verify PyGObject is reachable
        # Fail here with a clear message rather than 400 lines of collection errors.
        run: |
          uv run python - <<'PY'
          import gi
          gi.require_version("Gtk", "3.0")
          gi.require_version("Vte", "2.91")
          from gi.repository import Gtk, Vte
          print(f"gi {gi.__file__}")
          print(f"Gtk {Gtk.MAJOR_VERSION}.{Gtk.MINOR_VERSION}  Vte {Vte.MAJOR_VERSION}.{Vte.MINOR_VERSION}")
          PY

      - name: Run tests
        # -rs and the skip check are the point. Twelve tests gate themselves on a display
        # being present, so without Xvfb they vanish and the run still reports success.
        # A green tick that silently tested nothing is worse than a red one.
        # The one test left out is deselected, not skipped: it has Codex itself read the rules
        # .codex/rules/gh.rules gives a delegated Codex run, and there is no codex CLI here.
        # `doit check` runs it wherever codex is installed (#324).
        run: |
          set -o pipefail
          mkdir -p tmp
          uv run pytest -n auto -q -rs --cov --cov-report=xml:tmp/coverage.xml \
            --deselect tests/template/test_ai_agent_assets.py::test_codex_gh_rules_parse_and_match \
            | tee tmp/pytest.log
          if grep -qE "^SKIPPED|[0-9]+ skipped" tmp/pytest.log; then
            echo "::error::Tests were skipped. Everything they need is installed here, so a skip means the environment is wrong, not that the test is inapplicable."
            grep -E "^SKIPPED" tmp/pytest.log || true
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./tmp/coverage.xml
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the GTK stack
        # mypy resolves gi lazily, but vulture and bandit parse the tree and the doit
        # tasks run through the project environment, so build the same one as test.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $SYSTEM_PACKAGES

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Create the environment
        id: install
        run: |
          uv venv --system-site-packages --python /usr/bin/python3
          uv sync --all-extras --dev

      # Each check runs whether or not the one before it failed, so a PR shows every
      # failing check at once instead of one per push, as the template's lint job does.
      - name: Check environment drift
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run doit env_check

      - name: Check code formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run doit format_check

      - name: Run linting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run doit lint

      - name: Run type checking
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run doit type_check

      - name: Detect dead code
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run doit deadcode

      - name: Run security scan
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run doit security

      - name: Run spell check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run doit spell_check

      - name: Run dependency audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run doit audit

  # The site build, as doit check runs it: mkdocs --strict, so a broken link or a page
  # missing from the nav fails it. mkdocs reads the docs alone and imports no GCM module,
  # so this job needs no GTK stack.
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Create the environment
        run: |
          uv venv --python /usr/bin/python3
          uv sync --all-extras --dev

      - name: Build the documentation
        run: uv run doit docs_build

  # Builds the .deb and the .rpm as a release would, with fpm, and holds what fpm wrote
  # into them to the Makefile's recipes, which tests/test_packages.py holds the README to
  # (#273). Nothing else builds a package, so a recipe fpm refuses would otherwise reach
  # whoever next built one by hand.
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install fpm and the tools it builds with
        # ruby for fpm, rpm for rpmbuild, binutils for ar, gettext for the catalogs, and
        # desktop-file-utils to validate the entry. fpm 1.18.0 is the version measured.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ruby rpm binutils gettext \
            python3-pip make desktop-file-utils
          sudo gem install --no-document fpm -v 1.18.0

      - name: Build the .deb and the .rpm
        run: make deb rpm

      - name: Check what the packages declare
        run: python3 tools/packages.py gnome-connection-manager_*_all.deb gnome-connection-manager-*.noarch.rpm

      - name: Check that apt knows every package the .deb names
        # Alternatives included: a name apt does not know is a typo, or a package gone.
        # The names are read on their own line, as a failure inside `for`'s list would leave
        # it empty and the step passing.
        run: |
          names=$(python3 tools/packages.py --names deb)
          missing=0
          for package in $names; do
            apt-cache show "$package" >/dev/null 2>&1 || { echo "::error::apt knows no package $package"; missing=1; }
          done
          exit $missing

      - name: Validate the desktop entry
        # It exits 0 for a warning, as for the deprecated Encoding, so what it prints fails
        # the step too. Under bash -e, an assignment that fails would end the step unprinted.
        run: |
          report=$(desktop-file-validate gnome-connection-manager.desktop 2>&1) && code=0 || code=$?
          if [[ $code != 0 || -n $report ]]; then
            echo "::error::desktop-file-validate exited $code: $report"
            exit 1
          fi

  ci-complete:
    if: always()
    needs: [test, lint, package, docs]
    runs-on: ubuntu-24.04
    steps:
      - name: Check CI status
        run: |
          echo "Test result: ${{ needs.test.result }}"
          echo "Lint result: ${{ needs.lint.result }}"
          echo "Package result: ${{ needs.package.result }}"
          echo "Docs result: ${{ needs.docs.result }}"
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test job failed"
            exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint job failed"
            exit 1
          fi
          if [[ "${{ needs.package.result }}" != "success" ]]; then
            echo "Package job failed"
            exit 1
          fi
          if [[ "${{ needs.docs.result }}" != "success" ]]; then
            echo "Docs job failed"
            exit 1
          fi
          echo "CI completed successfully"
